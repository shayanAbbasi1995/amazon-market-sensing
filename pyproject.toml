[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amsense"
version = "0.1.0"
description = "Longitudinal, cross-country Amazon panels from McAuley Reviews 2023 + the Keepa API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb==1.5.5",
    "huggingface_hub==1.21.0",
    "matplotlib==3.11.0",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
