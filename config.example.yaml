# Copy to config.yaml and edit. Secrets (your Keepa key) go in .env, not here.

# A McAuley Amazon Reviews 2023 category (spelled as below), or any folder label
# if you bring your own ASINs (see `asins`):
# All_Beauty, Amazon_Fashion, Appliances, Arts_Crafts_and_Sewing, Automotive,
# Baby_Products, Beauty_and_Personal_Care, Books, CDs_and_Vinyl,
# Cell_Phones_and_Accessories, Clothing_Shoes_and_Jewelry, Digital_Music,
# Electronics, Gift_Cards, Grocery_and_Gourmet_Food, Handmade_Products,
# Health_and_Household, Health_and_Personal_Care, Home_and_Kitchen,
# Industrial_and_Scientific, Kindle_Store, Magazine_Subscriptions,
# Movies_and_TV, Musical_Instruments, Office_Products, Patio_Lawn_and_Garden,
# Pet_Supplies, Software, Sports_and_Outdoors, Subscription_Boxes,
# Tools_and_Home_Improvement, Toys_and_Games, Video_Games
category: Electronics

# Which ASINs to collect in the reference marketplace. `category` above is
# also the output folder name, so with a non-McAuley source it can be any label.
#   mcauley            products reviewed in review_window (below)
#   file               your own list: .txt (one ASIN per line), .csv or .parquet
#   keepa_finder       a Keepa Product Finder query: build it on keepa.com, click
#                      "Show API query" and save the JSON (costs tokens)
#   keepa_bestsellers  best-seller lists of Amazon category node ids (costs tokens)
# With Docker, keep `file` / `finder_selection` inside ./data so the container sees them.
asins:
  source: mcauley
  file: null                    # e.g. ./data/my_asins.txt
  column: asin                  # ASIN column for .csv / .parquet files
  finder_selection: null        # e.g. ./data/finder.json
  bestseller_categories: []     # e.g. [172282, 281052]
  max_asins: null               # optional cap on the seed list

# Products enter the sample if they received a review in this window
# (mcauley source only). McAuley data ends in September 2023; Keepa histories
# run to today.
review_window:
  start: 2023-01-01
  end: 2023-12-31

# Keepa marketplaces to collect: us uk de fr jp ca it es in mx br
# All share one token bucket, so they are collected one after another.
marketplaces: [us, uk, de, fr, ca, it, es]

# The reference marketplace is collected first and defines the ASIN universe
# that every other marketplace is queried with.
reference_marketplace: us

universe:
  # Drop ASINs whose current reference price is above this quantile.
  price_quantile_cut: 0.99

keepa:
  checkpoint_every: 25     # requests between parquet part rotations
  stats: null              # optional Keepa `stats` parameter

cleaning:
  price_ceiling_usd: 10000      # prices at/above this (converted to local currency) are dropped
  penny_threshold_usd: 1.0      # prices at/below this are kept and flagged
  review_count_ceiling: 10000000
  min_date: 2011-01-01          # observations before this are dropped

panels:
  build: [monthly_obs, monthly_locf, weekly_locf]   # also available: weekly_obs
  batches: 16                   # raise if DuckDB runs out of memory

duckdb:
  memory_limit: 8GB
  threads: 4

# Where everything is written. Templates: {data} {category} {CODE} {code}.
# Relative paths are relative to this file.
paths:
  data: ./data
  reviews:  "{data}/{category}/mcauley/reviews.parquet"
  metadata: "{data}/{category}/mcauley/metadata.parquet"
  seed:     "{data}/{category}/seed_asins.parquet"
  universe: "{data}/{category}/universe.parquet"
  keepa:    "{data}/{category}/keepa/{CODE}"
  panels:   "{data}/{category}/panels/{CODE}"
  fx:       "{data}/fx_monthly.parquet"
  tmp:      "{data}/duckdb_tmp"
  figures:  ./figures
